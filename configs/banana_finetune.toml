# 原版 π0，4090D 24GB 首轮局部场景试训；不是最优超参数声明。
[data]
directory = "data/lerobot/20261023-213415-07fb84"
train_repo_id = "local/pi0_banana_train"
prompt = "Pick up the banana and place it inside the open box."

[model]
family = "pi0"
config_name = "pi0_banana_lora"
# 首轮只训练 LoRA 参数，视觉与其他基础参数冻结，降低显存和小数据过拟合风险。
strict_lora_only = true

[train]
num_train_steps = 2000
batch_size = 1
num_workers = 0
seed = 42
warmup_steps = 100
peak_lr = 0.00001
decay_lr = 0.000001
save_interval = 500
keep_period = 1000
log_interval = 10

[paths]
initial_checkpoint = "cache/openpi/openpi-assets/checkpoints/pi0_aloha_sim"
assets_base_dir = "assets"
checkpoint_base_dir = "checkpoints"
