# 本地场景预览，不连接云服务器。所有位置单位为米。
[scene]
# 世界坐标：桌面为 z=0；x 沿桌子横向，y 沿桌子纵向。
banana_position = [0.18, 0.48, 0.045]
banana_yaw_degrees = 10.0
banana_mass_kg = 0.12
# 滑动、扭转、滚动摩擦系数；这里只是初始建模参数。
banana_friction = [0.8, 0.005, 0.0001]

# 固定盒子的底面中心；z=0 表示放在桌面上。
box_position = [0.13, 0.72, 0.0]

# top：俯视；angle：斜视。窗口内也可按 1 / 2 切换。
camera = "top"
# 重置后先推进这段仿真时间，让香蕉落到桌面。
settle_seconds = 0.6
