# v2 continues v1 weights, new optimizer and explicitly versioned state normalization.
[data]
directory = "data/lerobot/20261023-213415-07fb84"
train_repo_id = "local/pi0_banana_train"
prompt = "Pick up the banana and place it inside the open box."
[model]
family = "pi0"
config_name = "pi0_banana_lora"
strict_lora_only = true
train_action_projections = true
weighted_flow_loss = true
image_augmentation = false
[train]
num_train_steps = 4000
batch_size = 4
num_workers = 0
seed = 43
warmup_steps = 100
peak_lr = 0.00005
decay_lr = 0.000005
save_interval = 1000
keep_period = 2000
log_interval = 25
[paths]
initial_checkpoint = "checkpoints/pi0_banana_lora/banana_pilot_v1/1999"
assets_base_dir = "assets_v2"
checkpoint_base_dir = "checkpoints"
[sampling]
weights_file = "assets_v2/banana_sampling.json"
